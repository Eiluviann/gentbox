<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Approve asks for Face ID</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./an.css">
<script src="./sf-symbols.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.blur{position:absolute;inset:0;background:rgba(20,26,34,.7)}
.legend{position:absolute;left:22px;right:22px;bottom:40px;font-size:12px;line-height:16px;color:rgba(255,255,255,.82)}
.notif{grid-template-columns:38px minmax(0,1fr);opacity:.55;position:relative}
</style>
</helmet>
<div class="lock">
	<div class="blur"></div>
	<div style="height: 110px"></div>
	<div class="notif">
		<div class="appicon notif-appicon"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="{{ic.agent_bubble}}"></path><path class="prompt" d="{{ic.agent_prompt}}"></path></svg></div>
		<div>
			<div class="notif-title">URGENT: Your input is needed<span class="when">now</span></div>
			<div class="notif-sub">api · fix flaky test</div>
		</div>
	</div>
	<div class="faceid" role="img" aria-label="Face ID">
		<svg class="i" viewBox="0 0 100 100" aria-hidden="true" style="width: 64px; height: 64px"><path d="{{ic.faceid}}"></path></svg>
		<span>Face ID</span>
	</div>
	<div class="legend">Approve carries authenticationRequired: iOS unlocks with Face ID before the app sees the tap, so a locked phone in someone else's hand cannot approve. On failure the passcode field follows</div>
	<div class="home" style="background: #fff"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
	renderVals() {
		return { ic: window.SF_SYMBOLS || {} };
	}
}
</script>
</body>
</html>
