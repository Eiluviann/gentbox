[package]
name = "gentbox-ffi"
description = "UniFFI bindings of the Gentbox hub for the Mac app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "gentbox_ffi"
# `staticlib` feeds the XCFramework; `lib` keeps the crate testable from Rust.
crate-type = ["lib", "staticlib"]

[dependencies]
gentbox-core = { path = "../gentbox-core" }
gentbox-hub = { path = "../gentbox-hub" }
gentbox-ingest = { path = "../gentbox-ingest" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["std"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
# Pinned exactly: the generated Swift and the scaffolding must come from the
# same uniffi version, and `crates/gentbox-uniffi-bindgen` builds the
# generator from this very dependency.
uniffi = "=0.32.2"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "time"] }

# The workspace rules minus `unsafe_code`: UniFFI's generated scaffolding is
# `unsafe` (architecture §4). The crate's own code stays safe; review it so.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
