[package]
name = "gentbox-ingest"
description = "Gentbox ingest: the local HTTP API on the Unix socket and loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
gentbox-core = { path = "../gentbox-core" }
gentbox-hub = { path = "../gentbox-hub" }
getrandom = "0.3.4"
hmac = "0.12.1"
jsonschema = { version = "0.60.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.52.1", features = ["net", "rt", "sync", "time", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
gentbox-store = { path = "../gentbox-store" }
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.52.1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "fs"] }

[lints]
workspace = true
