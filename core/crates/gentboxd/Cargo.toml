[package]
name = "gentboxd"
description = "The headless Gentbox hub: ingest, store and policy without a UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gentbox-core = { path = "../gentbox-core" }
gentbox-hub = { path = "../gentbox-hub" }
gentbox-ingest = { path = "../gentbox-ingest" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
