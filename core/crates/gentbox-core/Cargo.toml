[package]
name = "gentbox-core"
description = "Gentbox domain: messages, classification and the noise-policy engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4.20"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known"] }
toml = "1.1.8"

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }

[lints]
workspace = true
